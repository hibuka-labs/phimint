ShortDescription: A terminal AI coding agent built on phi-agent
Description: |-
  phimint is a terminal AI coding agent built on phi-agent. Not just good at chat: it reads the code, changes it, compiles and tests until the job is done.

  It runs the full coding loop — understand the request, read the code, change multiple files, compile and test, iterate on failures. Features include code cells (CodeAct) that run code in a resident Python session, a streaming TUI, multi-agent fan-out, LSP-powered diagnostics, pull-based repository context, and three approval modes (auto / ask / deny).

  phimint needs one API key in ~/.phimint/config.json — run it once and it walks you through it.
