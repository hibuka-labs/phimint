name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Code quality checks ──
  check:
    name: check (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # ── Windows compile check ──
  #
  # release.sh publishes to crates.io BEFORE the 5-platform release workflow
  # runs, so a platform-only break used to land the broken crate on crates.io
  # first (0.7.0: `src/terminal_restore.rs` used `libc` unconditionally while
  # `libc` is a `cfg(unix)` dependency → the windows-x86_64 build failed with
  # 56 errors after 0.7.0 was already published).
  #
  # Every other CI job runs on ubuntu, so nothing else catches this. This job
  # compiles the crate for the Windows target BEFORE the publish step, which
  # turns a late platform break into an early, localizable one.
  windows-check:
    name: check (windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Compile for windows
        run: cargo check --all-targets --target x86_64-pc-windows-msvc

  # ── Installer contract ──
  #
  # install.sh / install.ps1 are what a user actually runs, and they are
  # shell scripts: the Rust gates never see them. Without this job a broken
  # installer only shows up when a real user runs it.
  installer:
    name: installer (unix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Contract test
        run: bash tests/install_script_test.sh

  installer-windows:
    name: installer (windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Contract test
        run: pwsh -NoProfile -File tests/install_script_test.ps1

  # ── Release asset contract ──
  #
  # scripts/gen-manifest.py decides what every release ships. It is Python,
  # so the Rust gates never see it — and a release that quietly omits an
  # asset is invisible until a user hits the 404. The tips band had exactly
  # that failure: no release ever published tips.json, so the cloud content
  # source never worked and the client silently kept its built-in tips.
  release-assets:
    name: release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Contract test
        run: bash tests/gen_manifest_test.sh

  # ── Build & test ──
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # ripgrep/repomap tests shell out to `rg` (preinstalled on mac/win runners)
      - name: Install ripgrep
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  # ── Documentation check ──
  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Check documentation
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  # ── Coverage ──
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # ripgrep/repomap tests shell out to `rg`
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # Line-coverage gate on the binary crate. Threshold set with headroom
      # for CI variance; ratchet upward as coverage improves.
      - name: Coverage gate
        run: cargo llvm-cov --lib --fail-under-lines 75 --lcov --output-path lcov.info

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info

  platform-gate:
    name: platform primitive gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: no hand-rolled HOME/USERPROFILE lookups
        run: |
          if grep -rnE --include='*.rs' --exclude-dir=target --exclude-dir=.git 'env::var(_os)?\("(HOME|USERPROFILE)"\)' .; then
            echo "Banned: use the repo home-dir helper (dirs::home_dir() or the local throat) instead of raw HOME/USERPROFILE env lookups."
            exit 1
          fi
