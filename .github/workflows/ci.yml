name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Code quality checks ──
  check:
    name: check (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # ── Windows compile check ──
  #
  # release.sh publishes to crates.io BEFORE the 5-platform release workflow
  # runs, so a platform-only break used to land the broken crate on crates.io
  # first (0.7.0: `src/terminal_restore.rs` used `libc` unconditionally while
  # `libc` is a `cfg(unix)` dependency → the windows-x86_64 build failed with
  # 56 errors after 0.7.0 was already published).
  #
  # Every other CI job runs on ubuntu, so nothing else catches this. This job
  # compiles the crate for the Windows target BEFORE the publish step, which
  # turns a late platform break into an early, localizable one.
  windows-check:
    name: check (windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Compile for windows
        run: cargo check --all-targets --target x86_64-pc-windows-msvc

  # ── Build & test ──
  test:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # ripgrep/repomap tests shell out to `rg`
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  # ── Documentation check ──
  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Check documentation
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  # ── Coverage ──
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # ripgrep/repomap tests shell out to `rg`
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # Line-coverage gate on the binary crate. Threshold set with headroom
      # for CI variance; ratchet upward as coverage improves.
      - name: Coverage gate
        run: cargo llvm-cov --lib --fail-under-lines 75 --lcov --output-path lcov.info

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
