[package]
name = "phiforge"
version = "0.1.0"
edition = "2024"
description = "phiforge — an AI coding agent built on phi-agent, used to stress-test the framework by writing code."
license = "MIT"
# `src/bin/replay.rs` is auto-discovered as a second binary; make `cargo run`
# default to the main one.
default-run = "phiforge"

[[bin]]
name = "phiforge"
path = "src/main.rs"

[dependencies]
# The framework (library) we build on. `shell` enables the local_shell tool;
# `multi-agent` enables the spawn/send/wait/close sub-agent tools.
phi-agent = { path = "../phi-agent", features = ["shell", "multi-agent"] }
# Kernel tools: LocalShellTool lives here (not re-exported by phi-agent's lib).
phi-kernel-tools = { path = "../phi-kernel-tools", features = ["shell"] }
# Runtime types not re-exported by phi-agent (ChatMessage, ResponseFormat,
# StreamClient) — needed by the `decompose` tool's nested structured LLM call.
agent-base = { version = "0.2.0", path = "../agent-base" }
# Skill types (PromptSkill) for /skill slash command (Phase 7b).
agent-works = { path = "../agent-works", default-features = false, features = ["skill", "prompt_skill"] }

tokio = { version = "1", features = ["full"] }
# CancellationToken for the interactive approval handler's `approve` signature.
tokio-util = "0.7"
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"

# UI: ratatui for the opt-in TUI, crossterm as its backend + raw-mode key/paste
# input for both the TUI and the inline chat.
ratatui = "0.29"
crossterm = "0.28"
# Direct termios access for the OSC 11 background probe (Unix only).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Display width for wide CJK glyphs (TUI wrap + inline cursor column).
unicode-width = "0.1"
# Clipboard for the TUI's Ctrl+Y "copy last reply" (arboard is cross-platform).
arboard = "3"

# Observability: mirror phi-agent's CLI — write `tracing` records to a
# session.log file (via log-core's LogCoreLayer) and per-turn event JSONL
# (via phi_agent::save_turn_log).
log-core = { path = "../log-core" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# RepoMap (Phase 2): tree-sitter grammars for symbol extraction across
# Rust, Java, TypeScript/TSX, JavaScript, C and C++.
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-java = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"

# LSP diagnostics (Phase 6b): protocol types only — the client is hand-rolled
# (JSON-RPC framing + rust-analyzer process) to stay dependency-light.
lsp-types = "0.95"

[dev-dependencies]
# Needed only to name `futures_core::Stream` in the `StreamClient` test stub
# for the `decompose` tool (the trait's `stream` return type).
futures-core = "0.3"
# 临时目录测试（skills 测试需要创建临时 SKILL.md 文件结构）。
tempfile = "3"
