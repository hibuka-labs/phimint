[package]
name = "phimint"
version = "0.6.0"
edition = "2024"
description = "phimint — a terminal AI coding agent built on phi-agent. Not just good at chat: it reads the code, changes it, compiles and tests until the job is done."
license = "MIT"
repository = "https://github.com/hibuka-labs/phimint"
keywords = ["ai", "agent", "tui", "coding-assistant", "llm"]
categories = ["command-line-interface", "development-tools"]
# Never ship agent instructions in the crate (crates.io tarballs are immutable).
exclude = ["CLAUDE.md", "CLAUDE.local.md"]

[[bin]]
name = "phimint"
path = "src/main.rs"

[dependencies]
# The framework (library) we build on. `shell` enables the local_shell tool;
# `multi-agent` enables the spawn/send/wait/close sub-agent tools; `skill`
# enables the /skill slash command (PromptSkill); `memory` enables persistent
# auto-memory (the four memory_* tools + MEMORY.md index injection, Phase 9c).
# The facade re-exports
# everything else the product needs (llm_trait, create_provider, guard,
# max_turns_nudge, registry snapshots, fan-in router) — no direct deps on
# agent-base / agent-works / phi-kernel-tools / llm-unified.
phi-agent = { version = "0.19.1", features = ["shell", "multi-agent", "skill", "memory", "plugin-wasm"] }
# Context rotation tools (notes, history, handoff) — the I/O layer.
phi-kernel-tools = { version = "0.11.0", features = ["context", "shell"] }
# Chat-style TUI components (lines/transcript/stream/markdown/completion/…),
# extracted from src/ui/ — the product keeps only the shell (app/render/handlers).
phi-tui = "0.3.0"
# Language intelligence (lsp/lang/repomap/ripgrep/diagnostics cores), extracted
# from src/lsp.rs + src/lang.rs + src/tools cores — the product keeps the Tool
# shells. Features declared explicitly per the distillation plan.
code-intel = { version = "0.1.0", default-features = false, features = ["lsp", "repomap"] }
# Design canvas (visual design companion): process-local HTTP server, canvas
# tools, click events. The product keeps the click mailbox / message synthesis
# (M2) and the consent gate; this crate owns server + token + screens.
phi-canvas = "0.1.0"
# Browser automation (22 CDP tools, `browser` feature): the agent drives its own
# Chrome so it can look at what it just showed the user — design-canvas
# self-check and reference patches. Behind the feature because of headless_chrome.
phi-tools = { version = "0.7.0", features = ["browser"] }

tokio = { version = "1", features = ["full"] }
# CancellationToken for the interactive approval handler's `approve` signature.
tokio-util = "0.7"
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
thiserror = "2"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }

# Update module: manifest fetch, semver compare, self-update apply
# (sha256 verify + tar.gz extract for `phimint update`; minisign is Phase 2).
reqwest = { version = "0.13", features = ["json", "stream"] }
semver = "1"
minisign-verify = "0.2"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"

# UI: ratatui for the TUI, crossterm as its backend + raw-mode key/paste input.
ratatui = "0.30"
crossterm = "0.28"
# Custom markdown rendering using pulldown-cmark (headings without #, horizontal rules, inline formatting).
pulldown-cmark = "0.13"
# Display width for wide CJK glyphs (TUI wrap).
unicode-width = "0.1"
# Clipboard for the TUI's Ctrl+Y "copy last reply" (arboard is cross-platform).
arboard = "3"

# Observability: mirror phi-agent's CLI — write `tracing` records to a
# session.log file (via log-core's LogCoreLayer) and per-turn event JSONL
# (via phi_agent::save_turn_log).
# phi-telemetry: per-turn token usage → session_metrics.json
phi-telemetry = "0.7.3"
log-core = "0.1.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
json5 = "1.3.1"

# term_guard: tcgetattr to spot an external termios clobber (MCP children can
# flip the tty back to cooked). Unix-only probe; Windows console is untouched.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Temp-dir tests (skills tests create temp SKILL.md file structures).
tempfile = "3"
# Streaming response construction for mock LLM (prompt guard tests / integration tests).
futures-util = { version = "0.3", default-features = false, features = ["std"] }


