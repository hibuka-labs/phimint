[package]
name = "phimint"
version = "0.1.0"
edition = "2024"
description = "phimint — an AI coding agent built on phi-agent, used to stress-test the framework by writing code."
license = "MIT"

[[bin]]
name = "phimint"
path = "src/main.rs"

[dependencies]
# The framework (library) we build on. `shell` enables the local_shell tool;
# `multi-agent` enables the spawn/send/wait/close sub-agent tools; `skill`
# enables the /skill slash command (PromptSkill). The facade re-exports
# everything else the product needs (llm_trait, create_provider, guard,
# max_turns_nudge, registry snapshots, fan-in router) — no direct deps on
# agent-base / agent-works / phi-kernel-tools / llm-unified.
phi-agent = { path = "../phi-agent", features = ["shell", "multi-agent", "skill"] }
# Chat-style TUI components (lines/transcript/stream/markdown/completion/…),
# extracted from src/ui/ — the product keeps only the shell (app/render/handlers).
phi-tui = { path = "../phi-tui" }
# Language intelligence (lsp/lang/repomap/ripgrep/diagnostics cores), extracted
# from src/lsp.rs + src/lang.rs + src/tools cores — the product keeps the Tool
# shells. Features declared explicitly per the distillation plan.
code-intel = { path = "../code-intel", default-features = false, features = ["lsp", "repomap"] }

tokio = { version = "1", features = ["full"] }
# CancellationToken for the interactive approval handler's `approve` signature.
tokio-util = "0.7"
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"

# UI: ratatui for the TUI, crossterm as its backend + raw-mode key/paste input.
ratatui = "0.30"
crossterm = "0.28"
# Custom markdown rendering using pulldown-cmark (headings without #, horizontal rules, inline formatting).
pulldown-cmark = "0.13"
# Display width for wide CJK glyphs (TUI wrap).
unicode-width = "0.1"
# Clipboard for the TUI's Ctrl+Y "copy last reply" (arboard is cross-platform).
arboard = "3"

# Observability: mirror phi-agent's CLI — write `tracing` records to a
# session.log file (via log-core's LogCoreLayer) and per-turn event JSONL
# (via phi_agent::save_turn_log).
# phi-telemetry: per-turn token usage → session_metrics.json
phi-telemetry = { path = "../phi-telemetry" }
log-core = { path = "../log-core" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# 临时目录测试（skills 测试需要创建临时 SKILL.md 文件结构）。
tempfile = "3"

# Force all transitive agent-base deps (e.g. agent-works from crates.io)
# to resolve to the local source so types stay compatible.
[patch.crates-io]
agent-base = { path = "../agent-base" }
agent-works = { path = "../agent-works" }
# TEMP(阶段 3 联调):phi-agent 依赖 phi-kernel-tools 0.6.0 未发布;发布后可移除
phi-kernel-tools = { path = "../phi-kernel-tools" }
# 统一 llm 类型到本地源(否则 agent-base 链上的 llm-trait 与本地
# llm-providers/llm-trait 是两套 crate,LlmProvider 类型不匹配)
llm-unified = { path = "../llm-providers" }
llm-trait = { path = "../llm-providers/llm-trait" }
